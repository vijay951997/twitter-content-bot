# Serves the SPA and proxies the API, so browser and API share one origin
# (session cookie + CSRF cookie work without CORS).

# Behind Caddy (production) keep the original scheme; when reached directly (local), use our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;   # keep the port so Spring sees requests as same-origin
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Allow larger request bodies than nginx's 1 MB default is not needed; keep it small.
    client_max_body_size 1m;

    location / {
        try_files $uri /index.html;
    }
}
